
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daget Sound</title>
<meta name="description" content="Dengerin sound di sini">

<meta property="og:title" content="Daget Sound 🎵">
<meta property="og:description" content="Klik untuk mendengarkan sound">
<meta property="og:image" content="https://daget-sound-01.vercel.app/preview.jpg">
<meta property="og:type" content="website">

<style>
body {
  background: #8da743;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px 15px;
}
.card {
  background: white;
  border-radius: 18px;
  padding: 25px;
  max-width: 350px;
  margin: auto;
}
button {
  background: #087be5;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 15px 25px;
  font-size: 17px;
}
</style>
</head>
<body>
<div class="card">
  <h2>🎵 Daget Sound</h2>
  <p>Tekan tombol di bawah untuk memutar sound.</p>
  <audio id="audio" src="sound.mp3"></audio>
  <button onclick="putar()">▶ Putar Sound</button>
</div>
<script>
function putar() {
  const a = document.getElementById('audio');
  if (a.paused) {
    a.play().catch(() => alert('Audio gagal diputar'));
  } else {
    a.pause();
  }
}
</script>
</body>
</html>
